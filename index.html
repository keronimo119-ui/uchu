<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>宇宙 — 本物の星空</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%;
    -webkit-user-select:none; user-select:none; overscroll-behavior:none;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif; }
  #cv { display:block; width:100vw; height:100vh; touch-action:none; }

  /* タイトル */
  #splash { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
    transition:opacity 2.5s ease; z-index:10; }
  #splash .t1 { color:#dfe8ff; font-size:min(13vw,86px); letter-spacing:0.6em;
    margin-left:0.6em; font-weight:200; text-shadow:0 0 30px rgba(150,180,255,.55); }
  #splash .t2 { color:#8fa3cc; font-size:min(3.6vw,15px); letter-spacing:0.35em;
    margin-top:18px; font-weight:300; }

  /* 操作ボタン */
  #ui { position:fixed; right:calc(10px + env(safe-area-inset-right)); top:50%;
    transform:translateY(-50%); display:flex; flex-direction:column; gap:14px;
    z-index:20; transition:opacity 1.2s ease; }
  #ui button { width:52px; height:52px; border-radius:50%;
    border:1px solid rgba(160,185,255,.35); background:rgba(10,16,38,.45);
    color:#c8d6ff; font-size:13px; line-height:1.15; cursor:pointer;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; flex-direction:column; }
  #ui button .ic { font-size:19px; }
  #ui button.on { background:rgba(70,110,255,.4); border-color:rgba(180,200,255,.8); color:#fff; }

  /* 誕生・消滅カウンター */
  #stats { position:fixed; left:calc(12px + env(safe-area-inset-left));
    bottom:calc(10px + env(safe-area-inset-bottom)); color:#7d8fbf; font-size:12px;
    letter-spacing:0.12em; z-index:20; transition:opacity 1.2s ease; text-shadow:0 0 6px #000; }
  #stats b { color:#c9d7ff; font-weight:500; }

  /* 星の情報カード */
  #card { position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(46px + env(safe-area-inset-bottom));
    background:rgba(8,12,30,.72); border:1px solid rgba(150,175,255,.3);
    border-radius:14px; padding:13px 22px; text-align:center; z-index:30;
    opacity:0; pointer-events:none; transition:opacity .5s ease;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); max-width:82vw; }
  #card.show { opacity:1; }
  #card .n  { font-size:21px; letter-spacing:0.15em; margin-bottom:3px; }
  #card .s  { color:#93a5d6; font-size:12px; letter-spacing:0.1em; }
  #card .d  { color:#c3cfF2; color:#c3cff2; font-size:13px; margin-top:7px; }
  #card .y  { color:#ffd9a0; font-size:12.5px; margin-top:5px; letter-spacing:0.06em; }

  /* 星座検索パネル */
  #panel { position:fixed; right:0; top:0; bottom:0; width:min(320px,78vw);
    background:rgba(6,10,26,.92); border-left:1px solid rgba(150,175,255,.25); z-index:40;
    transform:translateX(105%); transition:transform .35s ease; display:flex; flex-direction:column;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #panel.open { transform:none; }
  #panelHead { color:#c8d6ff; padding:14px 16px; font-size:15px; letter-spacing:.15em;
    display:flex; justify-content:space-between; align-items:center; }
  #panelClose { cursor:pointer; padding:2px 8px; font-size:17px; }
  #panelList { overflow-y:auto; padding:0 10px 24px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #panelList button { background:rgba(30,40,80,.5); color:#c8d6ff; border:1px solid rgba(150,175,255,.2);
    border-radius:8px; padding:9px 4px; font-size:12.5px; cursor:pointer; }

  /* 時代表示（歴史モード） */
  #era { position:fixed; left:50%; transform:translateX(-50%);
    top:calc(20px + env(safe-area-inset-top)); z-index:25; opacity:0;
    transition:opacity 1.2s ease; pointer-events:none; text-align:center;
    text-shadow:0 0 12px #000; }
  #era.show { opacity:1; }
  #era .t { color:#dfe6fa; font-size:min(4.6vw,19px); letter-spacing:.2em; }
  #era .y { color:#8fa3cc; font-size:min(3.2vw,12.5px); letter-spacing:.3em; margin-top:5px; }

  /* 現在地表示 */
  #pos { position:fixed; right:calc(12px + env(safe-area-inset-right));
    bottom:calc(10px + env(safe-area-inset-bottom)); color:#7d8fbf; font-size:11.5px;
    letter-spacing:.08em; z-index:20; transition:opacity 1.2s ease; text-shadow:0 0 6px #000; text-align:right; }

  /* 遊泳速度スライダー（左端・縦置き・宇宙遊泳モードのみ表示） */
  #speed { position:fixed; left:calc(4px + env(safe-area-inset-left)); top:50%;
    transform:translateY(-50%); z-index:20;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    transition:opacity 1.2s ease;
    background:rgba(10,16,38,.42); border:1px solid rgba(160,185,255,.28);
    border-radius:22px; padding:14px 7px;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  #speed .lbl { color:#9fb0dd; font-size:11.5px; letter-spacing:.15em; writing-mode:vertical-rl; }
  /* 横向きの range を回転させて縦スライダーにする（全Chromeで確実に縦になる） */
  #speed .track { position:relative; width:24px; height:min(40vh,190px); }
  #speed .track input { position:absolute; top:50%; left:50%; margin:0;
    width:min(40vh,190px); height:24px; accent-color:#7da2ff;
    transform:translate(-50%,-50%) rotate(-90deg); } /* 上=速い / 下=ゆっくり */

  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:#ffb0a0; font-size:15px; z-index:99; text-align:center; padding:0 30px; }
  .fade { opacity:0 !important; }
</style>
</head>

  <div class="t1">宇 宙</div>
  <div class="t2">実在の星を表示 ─ 位置・色・明るさ</div>
</div>

<div id="ui">
  <button id="bFull"><span class="ic">⛶</span><span>全画面</span></button>
  <button id="bCons"><span class="ic">✦</span><span>星座</span></button>

</div>

  <div class="track"><input id="speedR" type="range" min="0" max="100" value="36"></div>
</div>

<div id="era"><div class="t"></div><div class="y"></div></div>

<div id="panel">
  <div id="panelHead">星座をさがす<span id="panelClose">✕</span></div>
  <div id="panelList"></div>
</div>

<div id="stats" style="display:none">⏩ 超早回しの時間 ─ 誕生 <b id="nBorn">0</b>　消滅 <b id="nGone">0</b></div>
<div id="pos"></div>
<div id="card"></div>
<div id="err"></div>

<script src="stars.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const showErr = m => { const e = $('err'); e.style.display = 'flex'; e.textContent = m; };

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
} catch (e) { showErr('初回の読み込みにはインターネット接続が必要です'); throw e; }
if (!window.UCHU_DATA) { showErr('星データ(stars.js)が見つかりません'); throw new Error('no data'); }

// ═══════════════ 日本語名 ═══════════════
const JP_CON = {And:"アンドロメダ座",Ant:"ポンプ座",Aps:"ふうちょう座",Aqr:"みずがめ座",Aql:"わし座",Ara:"さいだん座",Ari:"おひつじ座",Aur:"ぎょしゃ座",Boo:"うしかい座",Cae:"ちょうこくぐ座",Cam:"きりん座",Cnc:"かに座",CVn:"りょうけん座",CMa:"おおいぬ座",CMi:"こいぬ座",Cap:"やぎ座",Car:"りゅうこつ座",Cas:"カシオペヤ座",Cen:"ケンタウルス座",Cep:"ケフェウス座",Cet:"くじら座",Cha:"カメレオン座",Cir:"コンパス座",Col:"はと座",Com:"かみのけ座",CrA:"みなみのかんむり座",CrB:"かんむり座",Crv:"からす座",Crt:"コップ座",Cru:"みなみじゅうじ座",Cyg:"はくちょう座",Del:"いるか座",Dor:"かじき座",Dra:"りゅう座",Equ:"こうま座",Eri:"エリダヌス座",For:"ろ座",Gem:"ふたご座",Gru:"つる座",Her:"ヘルクレス座",Hor:"とけい座",Hya:"うみへび座",Hyi:"みずへび座",Ind:"インディアン座",Lac:"とかげ座",Leo:"しし座",LMi:"こじし座",Lep:"うさぎ座",Lib:"てんびん座",Lup:"おおかみ座",Lyn:"やまねこ座",Lyr:"こと座",Men:"テーブルさん座",Mic:"けんびきょう座",Mon:"いっかくじゅう座",Mus:"はえ座",Nor:"じょうぎ座",Oct:"はちぶんぎ座",Oph:"へびつかい座",Ori:"オリオン座",Pav:"くじゃく座",Peg:"ペガスス座",Per:"ペルセウス座",Phe:"ほうおう座",Pic:"がか座",Psc:"うお座",PsA:"みなみのうお座",Pup:"とも座",Pyx:"らしんばん座",Ret:"レチクル座",Sge:"や座",Sgr:"いて座",Sco:"さそり座",Scl:"ちょうこくしつ座",Sct:"たて座",Ser:"へび座",Sex:"ろくぶんぎ座",Tau:"おうし座",Tel:"ぼうえんきょう座",Tri:"さんかく座",TrA:"みなみのさんかく座",Tuc:"きょしちょう座",UMa:"おおぐま座",UMi:"こぐま座",Vel:"ほ座",Vir:"おとめ座",Vol:"とびうお座",Vul:"こぎつね座"};
const JP_STAR = {Sirius:"シリウス",Canopus:"カノープス",Arcturus:"アークトゥルス","Rigil Kentaurus":"リギル・ケンタウルス",Vega:"ベガ",Capella:"カペラ",Rigel:"リゲル",Procyon:"プロキオン",Achernar:"アケルナル",Betelgeuse:"ベテルギウス",Hadar:"ハダル",Altair:"アルタイル",Acrux:"アクルックス",Aldebaran:"アルデバラン",Antares:"アンタレス",Spica:"スピカ",Pollux:"ポルックス",Fomalhaut:"フォーマルハウト",Deneb:"デネブ",Mimosa:"ミモザ",Regulus:"レグルス",Adhara:"アダーラ",Castor:"カストル",Shaula:"シャウラ",Bellatrix:"ベラトリックス",Elnath:"エルナト",Miaplacidus:"ミアプラキドゥス",Alnilam:"アルニラム",Alnitak:"アルニタク",Alnair:"アルナイル",Alioth:"アリオト",Mirfak:"ミルファク",Dubhe:"ドゥーベ",Wezen:"ウェズン",Alkaid:"アルカイド",Sargas:"サルガス",Menkalinan:"メンカリナン",Alhena:"アルヘナ",Polaris:"ポラリス（北極星）",Mizar:"ミザール",Alphard:"アルファルド",Hamal:"ハマル",Diphda:"ディフダ",Alpheratz:"アルフェラッツ",Mirach:"ミラク",Algol:"アルゴル（悪魔の星）",Albireo:"アルビレオ",Denebola:"デネボラ",Alphecca:"アルフェッカ",Rasalhague:"ラス・アルハゲ",Eltanin:"エルタニン",Kochab:"コカブ",Scheat:"シェアト",Markab:"マルカブ",Menkar:"メンカル",Unukalhai:"ウヌクアルハイ",Sadr:"サドル",Enif:"エニフ",Mira:"ミラ（不思議の星）",Thuban:"トゥバン（昔の北極星）",Arneb:"アルネブ",Nunki:"ヌンキ",Ankaa:"アンカア",Izar:"イザール",Almach:"アルマク",Caph:"カフ",Schedar:"シェダル",Merak:"メラク",Phecda:"フェクダ",Megrez:"メグレズ",Atria:"アトリア",Avior:"アヴィオール",Aspidiske:"アスピディスケ",Suhail:"スハイル",Naos:"ナオス",Mintaka:"ミンタカ",Saiph:"サイフ",Alcyone:"アルキオーネ（すばる）",Atlas:"アトラス",Electra:"エレクトラ",Maia:"マイア",Merope:"メローペ",Taygeta:"タイゲタ",Gacrux:"ガクルックス","Kaus Australis":"カウス・アウストラリス"};

// 88星座の紹介（神話・特徴のひとこと）
const CON_INFO = {And:"鎖につながれた王女。アンドロメダ銀河のすみか",Ant:"空気ポンプ。18世紀生まれの科学の星座",Aps:"極楽鳥。南天の小さな星座",Aqr:"水を注ぐ美少年ガニメデ。黄道十二星座",Aql:"ゼウスの使いの鷲。アルタイルは七夕の彦星",Ara:"神々が誓いを立てた祭壇",Ari:"空飛ぶ金色の羊。黄道十二星座の先頭",Aur:"戦車を駆る王。カペラは冬の六角形の一角",Boo:"熊を追う牛飼い。アークトゥルスは春の主役",Cae:"彫刻家ののみ。南天の小星座",Cam:"北の空の静かなキリン",Cnc:"ヘルクレスに踏まれた蟹。プレセペ星団が有名",CVn:"牛飼いが連れる2匹の猟犬",CMa:"オリオンの猟犬。全天一明るいシリウスの星座",CMi:"小さな相棒。プロキオンは冬の大三角の一角",Cap:"上半身ヤギ・下半身魚。黄道十二星座",Car:"アルゴ船の竜骨。カノープスは幸運の星",Cas:"自慢好きの王妃。Wの形は北の道しるべ",Cen:"賢者ケイロン。太陽に最も近い星のすみか",Cep:"エチオピア王。五角形の家の形",Cet:"王女を襲った海の怪物。不思議星ミラが光る",Cha:"南極近くの小さなカメレオン",Cir:"製図用コンパス。南天の小星座",Col:"ノアの箱舟から放たれた鳩",Com:"王妃が捧げた髪。銀河の群れが見える場所",CrA:"いて座の足元の小さな冠",CrB:"王女アリアドネの冠。美しい半円",Crv:"嘘をついて黒くされたアポロンのカラス",Crt:"アポロンの聖杯",Cru:"全天最小の星座。南半球の象徴サザンクロス",Cyg:"白鳥に化けたゼウス。デネブと北十字",Del:"海神の使いのイルカ。小さなひし形",Dor:"大マゼラン雲を抱く南天のカジキ",Dra:"黄金のリンゴを守る竜。北極星の周りを巻く",Equ:"全天で2番目に小さな子馬",Eri:"天を流れる大河。果てにアケルナルが輝く",For:"化学者の炉。南天の静かな星座",Gem:"カストルとポルックスの双子。黄道十二星座",Gru:"優雅に飛ぶ鶴。秋の南の空",Her:"12の冒険の英雄。球状星団M13が有名",Hor:"振り子時計。南天の小星座",Hya:"全天最大の星座。9つの頭を持つ大蛇",Hyi:"南極近くの小さな水蛇",Ind:"南天に立つ先住民の姿",Lac:"北の空を走る小さなトカゲ",Leo:"ヘルクレスが倒した獅子。春の王者",LMi:"獅子の子。親の背にひっそりと",Lep:"オリオンの足元を逃げる野ウサギ",Lib:"正義の女神の天秤。黄道十二星座",Lup:"ケンタウルスに捕らえられた狼",Lyn:"「山猫の目でないと見えない」暗い星座",Lyr:"オルフェウスの竪琴。ベガは七夕の織姫",Men:"テーブル山。全天でいちばん暗い星座",Mic:"顕微鏡。18世紀の科学の星座",Mon:"冬の大三角の中にひそむユニコーン",Mus:"南十字のそばの小さなハエ",Nor:"製図用の定規。天の川の中",Oct:"天の南極を含む八分儀",Oph:"医術の神。大蛇を操る",Ori:"狩人の王。三ツ星と大星雲、冬の主役",Pav:"女神ヘラの聖鳥クジャク",Peg:"翼を持つ天馬。秋の四辺形",Per:"メデューサを倒した英雄。悪魔の星アルゴル",Phe:"何度でも蘇る不死鳥",Pic:"画家のイーゼル。南天の小星座",Psc:"紐で結ばれた親子の魚。黄道十二星座",PsA:"秋のひとつ星フォーマルハウトの星座",Pup:"アルゴ船の船尾。天の川が濃い場所",Pyx:"アルゴ船の羅針盤",Ret:"望遠鏡の照準線。南天の小星座",Sge:"愛の神が放った矢。全天3番目に小さい",Sgr:"弓を引くケンタウルス。天の川銀河の中心方向",Sco:"オリオンを刺したサソリ。真紅のアンタレス",Scl:"彫刻家のアトリエ。秋の南の空",Sct:"王の盾。天の川の輝く雲の中",Ser:"へびつかいに持たれ頭と尾に分かれた大蛇",Sex:"天文観測の六分儀",Tau:"白い牡牛に化けたゼウス。すばるとアルデバラン",Tel:"南天の望遠鏡",Tri:"小さな三角形。渦巻銀河M33のすみか",TrA:"南天のもうひとつの三角形",Tuc:"大きなくちばしのオオハシ。小マゼラン雲を抱く",UMa:"北斗七星を含む大熊",UMi:"北極星ポラリスを尾の先に持つ小熊",Vel:"アルゴ船の帆。南の天の川",Vir:"豊穣の女神。スピカは真珠星",Vol:"南天を飛ぶトビウオ",Vul:"ガチョウをくわえた小ぎつね"};

// ═══════════════ 星の色（B-V色指数 → 実際の色温度 → RGB）═══════════════
function bvToRGB(bv) {
  bv = Math.max(-0.4, Math.min(2.0, bv));
  let k = 4600 * (1 / (0.92 * bv + 1.7) + 1 / (0.92 * bv + 0.62));
  k /= 100;
  let r, g, b;
  if (k <= 66) { r = 255; g = 99.4708 * Math.log(k) - 161.12; }
  else { r = 329.698 * Math.pow(k - 60, -0.1332); g = 288.122 * Math.pow(k - 60, -0.0755); }
  if (k >= 66) b = 255; else if (k <= 19) b = 0; else b = 138.518 * Math.log(k - 10) - 305.045;
  const c = v => Math.max(0, Math.min(1, v / 255));
  return [c(r) * 0.93 + 0.07, c(g) * 0.93 + 0.07, c(b) * 0.93 + 0.07]; // 天体写真寄りの色乗り
}

// ═══════════════ 基本セットアップ ═══════════════
const D = window.UCHU_DATA;
const canvas = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false; // 星空の上に歴史モードの地球を重ね描きするため手動クリア

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 2e6);
camera.up.set(0, 0, 1); // 天の北極が上（データ座標系に合わせる）
camera.position.set(0, 0, 0);

// ═══════════════ 星のシェーダー（実在星・天の川・新生星で共用）═══════════════
const starUniforms = { uTime: { value: 0 }, uSize: { value: PR } };
const starMat = new THREE.ShaderMaterial({
  uniforms: starUniforms,
  transparent: true, depthWrite: false, depthTest: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime; uniform float uSize;
    attribute float aMag; attribute vec3 aColor; attribute float aPhase;
    varying vec3 vColor; varying float vInt;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float tw = 0.92 + 0.08 * sin(uTime * (1.2 + aPhase * 2.3) + aPhase * 37.0);
      float s = clamp(10.0 - aMag * 1.0, 1.6, 16.0);
      vInt = clamp(pow(10.0, -0.16 * aMag) * 2.6, 0.0, 1.8) * tw;
      vColor = aColor;
      gl_PointSize = s * uSize;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    precision highp float;
    varying vec3 vColor; varying float vInt;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv) * 2.0;
      if(d > 1.0) discard;
      float core = exp(-d * d * 9.0);
      float halo = exp(-d * 2.7) * 0.42;
      float spikeW = smoothstep(0.75, 1.4, vInt);

function glowSprite(r, g, b, sx, sy, opacity, soft) {

}

const NB_MAX = 800;

const bhWorld = new THREE.Vector3();
const ABSORB_R = 1.7;
const GAL_AXIS = new THREE.Vector3().randomDirection(); // この宇宙の銀河回転軸（起動ごとに違う銀河が育つ）
let bhMass = 900;         // ブラックホールの質量（星を呑むほど重くなる）
let born = 0, gone = 0, flash = 0;
const SIM = { speed: 1 }; // 時間の早回し倍率（動作確認・将来のタイムラプス用）

function spawnStar() {
  if (nb.length >= NB_MAX) return;
  const c = bvToRGB(-0.3 + Math.random() * 1.6);
  // 星はBHを取り巻く雲の中に「ほぼ静止」して生まれる（原作準拠：自力で動くのは1%の流れ星だけ）
  const dir = new THREE.Vector3().randomDirection();
  const d = 14 + Math.random() * 40;
  const p = bhWorld.clone().add(dir.clone().multiplyScalar(d));
  let v;
  if (Math.random() < 0.01) {
    v = new THREE.Vector3().randomDirection().multiplyScalar(6 + Math.random() * 8); // ごく稀な流れ星
  } else {
    let tang = new THREE.Vector3().crossVectors(GAL_AXIS, dir);
    if (tang.lengthSq() < 1e-6) tang.set(1, 0, 0);
    // 生まれた雲が持つ回転の勢い（角運動量）。これがないと全星が即BHへ直落ちする
    const vc = Math.sqrt(bhMass / d);
    v = tang.normalize().multiplyScalar(vc * (0.35 + Math.random() * 0.4))
          .addScaledVector(new THREE.Vector3().randomDirection(), 0.3); // 雲の乱流ぶんの揺らぎ
  }
  nb.push({ p, v, c, m: 2.1 + Math.random() * 2.8, age: 0, doom: false });
  born++;
  if (nb.length > NB_MAX * 0.92) doomOldest(); // 満員が近づくと古い星の軌道が乱れ始める
}

// 最も年老いた星の軌道が乱れ、BHへの転落が始まる
function doomOldest() {
  let old = null;
  for (const s of nb) if (!s.doom && (!old || s.age > old.age)) old = s;
  if (old) old.doom = true;
}

// 力学: BHの重力 + 星同士の引力(重心近似) + 円軌道への緩やかな収束(ガス摩擦の代役)
// → 時間をかけて自然に回転円盤（ミニ銀河）へ育つ
const _com = new THREE.Vector3(), _a = new THREE.Vector3(), _b = new THREE.Vector3(), _tan = new THREE.Vector3();
function updateNewborn(sdt) {
  let rem = sdt;
  while (rem > 1e-6) { // 早回しでも軌道が壊れないよう小刻みに計算
    const dt = Math.min(rem, 0.05); rem -= dt;
    const n = nb.length;
    _com.set(0, 0, 0);
    for (const s of nb) _com.add(s.p);
    if (n > 0) _com.multiplyScalar(1 / n);
    for (let i = n - 1; i >= 0; i--) {
      const s = nb[i];
      s.age += dt;
      if (s.doom) { // 転落中の星: 回りながら確実にBHへ落ちる「死の螺旋」（決定論的）
        _b.copy(s.p).sub(bhWorld);
        const h = _b.dot(GAL_AXIS);
        _a.copy(_b).addScaledVector(GAL_AXIS, -h);
        let rr = Math.max(_a.length(), 0.01);
        _a.multiplyScalar(1 / rr);
        _tan.crossVectors(GAL_AXIS, _a);
        const ang = Math.sqrt(bhMass / Math.max(rr, 1.5)) / rr * dt; // ケプラー回転しつつ
        const shrink = Math.exp(-dt / 12);                            // 半径がゆっくり縮む
        const nr = rr * shrink;
        s.p.copy(bhWorld).addScaledVector(_a, Math.cos(ang) * nr)
           .addScaledVector(_tan, Math.sin(ang) * nr).addScaledVector(GAL_AXIS, h * shrink);
        if (nr < ABSORB_R) { nb.splice(i, 1); gone++; flash = 1; }
        continue;
      }
      // BHの重力
      _a.copy(bhWorld).sub(s.p);
      const d = Math.max(_a.length(), 0.6);
      s.v.addScaledVector(_a.normalize(), bhMass / (d * d) * dt);
      // 星同士の引力（群れ全体の重心へ緩く引き合う）
      _b.copy(_com).sub(s.p);
      const dc2 = _b.lengthSq() + 25;
      s.v.addScaledVector(_b.normalize(), 60 * (n / NB_MAX) / dc2 * dt);
      // 円盤化：回転軸まわりの円軌道へゆっくり寄せる（ほんの少し内向き→最後はBHへ還る）
      _b.copy(s.p).sub(bhWorld);
      _b.addScaledVector(GAL_AXIS, -_b.dot(GAL_AXIS)); // 回転面内の成分
      if (_b.lengthSq() > 1.0) {
        _b.normalize();
        _tan.crossVectors(GAL_AXIS, _b);
        const vc = Math.sqrt(bhMass / Math.max(d, 2.5));
        _a.copy(_tan).multiplyScalar(vc).addScaledVector(_b, -vc * 0.05);
        s.v.lerp(_a, Math.min(1, 0.02 * dt));
      }
      const sp = s.v.length(), cap = d < 6 ? 50 : 30; // 重いBHの軌道速度でも保てる上限
      if (sp > cap) s.v.multiplyScalar(cap / sp);
      s.p.addScaledVector(s.v, dt);
      if (d < ABSORB_R) { nb.splice(i, 1); gone++; flash = 1; }
    }
  }
}

      if (uOn > 0.004) {
        vec2 dir = dv / r;
        float sw = clamp(rs * 1.6 / r, 0.0, 1.2) * uOn;   // 光の渦巻き
        float cs = cos(sw), sn = sin(sw);
        vec2 dirR = vec2(dir.x*cs - dir.y*sn, dir.x*sn + dir.y*cs);
        float bend = min(rs * rs * 2.4 / r, r * 0.92) * uOn; // 重力レンズの曲がり
        vec2 suv = clamp((p - dirR * bend) / uRes, 0.0, 1.0);
        c = texture2D(tS, suv).rgb;
        c *= mix(1.0, smoothstep(rs * 0.98, rs * 1.08, r), uOn); // 事象の地平面（真の闇）
        float ring = exp(-pow((r - rs * 1.18) / (rs * 0.13), 2.0)); // 光子リング
        c += vec3(1.0, 0.85, 0.6) * ring * 1.1 * uOn;
        float ca = cos(0.55), sa = sin(0.55); // 降着円盤（傾いた光の渦）
        vec2 q = vec2(dv.x*ca - dv.y*sa, dv.x*sa + dv.y*ca);
        vec2 e = vec2(q.x, q.y * 3.2);
        float er = length(e) / rs;
        if (er > 1.2 && er < 5.0) {
          float ang = atan(e.y, e.x);
          float band = 0.6 + 0.4 * sin(er * 6.5 - uTime * 2.2 + ang * 3.0);
          float fall = pow(1.5 / er, 2.4) * smoothstep(5.0, 3.6, er) * smoothstep(1.2, 1.5, er);
          float dop = 1.0 + 0.9 * cos(ang); // ドップラービーミング（近づく側が明るい）
          vec3 dc = mix(vec3(1.0, 0.95, 0.85), vec3(1.0, 0.5, 0.15), clamp((er - 1.2) / 3.2, 0.0, 1.0));
          c += dc * band * fall * dop * 0.85 * uOn;
        }
        c += vec3(1.0, 0.95, 0.85) * uFlash * exp(-r / (rs * 6.0)) * uOn; // 星を呑んだ閃光
      } else {
        c = texture2D(tS, vUv).rgb;
      }
      float vg = 1.0 - 0.26 * pow(length(vUv - 0.5) * 1.35, 2.6); // 周辺減光
      gl_FragColor = vec4(c * 1.22 * vg, 1.0);
    }`
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

// ═══════════════ 歴史モード：地球46億年の旅（実史実の年表） ═══════════════

// 地球カメラと星カメラのズーム比（起動時の見え方は保ったまま、ピンチ倍率だけ一致させる用）
const HCAM_FOV_K = Math.tan(hCam.fov * 0.5 * Math.PI / 180) / Math.tan(camera.fov * 0.5 * Math.PI / 180);

const NOISE_GLSL = `
  float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
  float vnoise(vec3 p){
    vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(
      mix(mix(hash(i), hash(i+vec3(1.,0.,0.)), f.x), mix(hash(i+vec3(0.,1.,0.)), hash(i+vec3(1.,1.,0.)), f.x), f.y),
      mix(mix(hash(i+vec3(0.,0.,1.)), hash(i+vec3(1.,0.,1.)), f.x), mix(hash(i+vec3(0.,1.,1.)), hash(i+vec3(1.,1.,1.)), f.x), f.y), f.z);
  }
  float fbm(vec3 p){ float v=0.0, a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.03; a*=0.5; } return v; }`;
const SPHERE_VERT = `
  varying vec3 vN; varying vec3 vObj; varying vec3 vW;
  void main(){
    vObj = position;
    vN = normalize(mat3(modelMatrix) * normal);
    vec4 w = modelMatrix * vec4(position, 1.0);
    vW = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;

// 地球：大陸はノイズ生成、時代ごとに海・氷・雲・マグマ・街あかりが変わる
const earthUni = {
  uSunDir: { value: new THREE.Vector3(1, 0, 0) }, uTime: { value: 0 },
  uSea: { value: 0.62 }, uIce: { value: 0.12 }, uCloud: { value: 0.5 },
  uGlow: { value: 0 }, uCity: { value: 1 },
  uLand: { value: new THREE.Color(0.14, 0.26, 0.1) },
  uOcean: { value: new THREE.Color(0.02, 0.12, 0.3) }
};
const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 96, 64),
  new THREE.ShaderMaterial({
    uniforms: earthUni,
    vertexShader: SPHERE_VERT,
    fragmentShader: `
      precision highp float;
      uniform vec3 uSunDir; uniform float uTime, uSea, uIce, uCloud, uGlow, uCity;
      uniform vec3 uLand, uOcean;
      varying vec3 vN; varying vec3 vObj; varying vec3 vW;
      ${NOISE_GLSL}
      void main(){
        vec3 n = normalize(vN);
        vec3 p = normalize(vObj);
        float cont = fbm(p*2.6 + 7.3);
        float landM = smoothstep(uSea, uSea + 0.06, cont);
        vec3 col = mix(uOcean, uLand, landM);
        col = mix(col, uOcean*1.6 + vec3(0.03,0.10,0.09), smoothstep(uSea-0.06, uSea, cont)*(1.0-landM)*0.7);
        float lat = abs(p.y);
        float ice = smoothstep(1.05-uIce, 1.12-uIce, lat + (cont-0.5)*0.15);
        ice = max(ice, smoothstep(0.55, 0.95, uIce));
        ice = clamp(ice, 0.0, 1.0);
        col = mix(col, vec3(0.91,0.94,1.0), ice);
        float cl = smoothstep(0.5, 0.72, fbm(p*3.4 + vec3(uTime*0.02, 0.0, uTime*0.013))) * uCloud;
        col = mix(col, vec3(0.98), cl*0.85);
        float ndl = clamp(dot(n, uSunDir), 0.0, 1.0);
        vec3 outc = col * (0.04 + 1.1*ndl);
        float cracks = pow(clamp(1.0 - abs(fbm(p*5.0+2.0)-0.5)*3.0, 0.0, 1.0), 6.0);
        outc += vec3(1.0,0.36,0.08)*cracks*uGlow*1.7 + vec3(1.0,0.5,0.15)*uGlow*0.18;
        float city = pow(vnoise(p*36.0), 7.0) * 6.0;
        outc += vec3(1.0,0.82,0.45)*clamp(city,0.0,1.0)*landM*(1.0-ice)*pow(1.0-ndl,2.0)*uCity;
        vec3 vDir = normalize(cameraPosition - vW);
        float rim = pow(1.0 - clamp(dot(n, vDir), 0.0, 1.0), 3.0);
        vec3 atmo = mix(vec3(0.35,0.55,1.0), vec3(1.0,0.45,0.2), uGlow);
        outc += atmo * rim * (0.10 + 0.6*ndl);
        gl_FragColor = vec4(outc, 1.0);
      }`
  }));

const ERAS = [

const HIST_LOOP = 185; // 46億年を約3分で一巡
let histP = 0, mAng = 0.8, hTh = 0.7, hPh = 1.3, hR = 5.5, vhTh = 0, vhPh = 0, eraIdx = -1;
let histFreeze = false; // 動作確認用：ONにすると時代・カメラのドリフトを止めて狙った構図で撮れる

function updateHistory(dt) {
  if (!histFreeze) { histP += dt / HIST_LOOP; if (histP >= 1) histP = 0; }
  const fi = histP * (ERAS.length - 1);
  const i0 = Math.floor(fi), i1 = Math.min(i0 + 1, ERAS.length - 1);
  let f = fi - i0; f = f * f * (3 - 2 * f);
  const A = ERAS[i0], B = ERAS[i1];
  const L = (a, b) => a + (b - a) * f;
  earthUni.uSea.value = L(A[2], B[2]); earthUni.uIce.value = L(A[3], B[3]);
  earthUni.uCloud.value = L(A[4], B[4]); earthUni.uGlow.value = L(A[5], B[5]);
  earthUni.uCity.value = L(A[6], B[6]);
  earthUni.uLand.value.setRGB(L(A[7][0], B[7][0]), L(A[7][1], B[7][1]), L(A[7][2], B[7][2]));
  earthUni.uOcean.value.setRGB(L(A[8][0], B[8][0]), L(A[8][1], B[8][1]), L(A[8][2], B[8][2]));
  earthUni.uTime.value = tNow;
  earthMesh.rotation.y += dt * 0.35; // 自転
  // 月：昔ほど近く、近いほど速く回る（実物理）
  const mD = L(A[9], B[9]);
  moonMesh.visible = mD > 5;
  if (moonMesh.visible) {
    mAng += dt * 1.2 / Math.pow(mD / 17, 1.5);
    moonMesh.position.set(Math.cos(mAng) * mD, Math.sin(mAng * 0.6) * 1.6, Math.sin(mAng) * mD);
  }
  if (!histFreeze) updatePlanets(tNow); // 他の惑星（さまよう点光）をゆっくり動かす
  // 時代キャプション
  const idx = Math.round(fi);
  if (idx !== eraIdx) {
    eraIdx = idx;
    document.querySelector('#era .t').textContent = ERAS[idx][0];
    document.querySelector('#era .y').textContent = ERAS[idx][1];
  }
  // カメラ：地球を常に枠内に、昼側を中心にゆったり漂う（ドラッグで夜側も見られる）
  if (!histFreeze) {
    vhTh *= Math.pow(0.75, dt); vhPh *= Math.pow(0.75, dt);
    const hTarget = Math.sin(tNow * 0.021) * 1.1; // 太陽のある側でゆらゆら
    hTh += (hTarget - hTh) * Math.min(1, dt * 0.1) + vhTh * dt;
    hPh += vhPh * dt + Math.sin(tNow * 0.031) * 0.03 * dt;
    hPh = Math.max(0.35, Math.min(2.75, hPh));
    hR = 5.2 + 1.6 * Math.sin(tNow * 0.043);
  }
  const sp = Math.sin(hPh);
  hCam.position.set(hR * sp * Math.cos(hTh), hR * Math.cos(hPh), hR * sp * Math.sin(hTh));
  hCam.lookAt(0, 0, 0);
  // ピンチで背景の星をズームすると、地球・月も同じ倍率で連動して大小する
  hCam.fov = 2 * Math.atan(HCAM_FOV_K * Math.tan(camera.fov * 0.5 * Math.PI / 180)) * 180 / Math.PI;
  hCam.updateProjectionMatrix();
}

  let best = -1, bestScore = 1e9, bestAng = 1e9;
  for (let i = 0; i <= nReal; i++) { // 実在星＋太陽
    const dx = pos[i * 3] - camera.position.x, dy = pos[i * 3 + 1] - camera.position.y, dz = pos[i * 3 + 2] - camera.position.z;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (len < 0.25) continue; // 目の前すぎる星は対象外
    const dot = (dx * ray.x + dy * ray.y + dz * ray.z) / len;
    if (dot < 0.996) continue;
    const ang = Math.acos(Math.min(1, dot));
    const score = ang * (1 + 0.13 * (mag[i] + 1.5));
    if (score < bestScore) { bestScore = score; best = i; bestAng = ang; }
  }
  const limit = 0.045 * camera.fov / 62;
  if (best < 0 || bestAng > limit) { card.classList.remove('show'); return; }
  if (best === nSun) { // 太陽
    const dly = camera.position.length() * 3.2616;
    card.innerHTML = `<div class="n" style="color:#ffe9b0">太陽 ─ 私たちの母星</div>
      <div class="s">Sol ／ 地球はこの光のすぐ隣（遠すぎて見えない小ささ）</div>
      <div class="d">いまのあなたから ${dly.toFixed(1)}光年</div>
      <div class="y">人類の歴史のすべては、この小さな光のまわりで起きました</div>`;
    card.classList.add('show');
    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => card.classList.remove('show'), 8000);
    return;
  }
  const s = D.stars[best];
  const conJp = s[5] >= 0 ? (JP_CON[D.cons[s[5]]] || D.cons[s[5]]) : '';
  const proper = D.names[best];
  const name = proper ? (JP_STAR[proper] || proper) : (conJp ? conJp + 'の星' : '名もなき星');
  const sub = proper ? `${proper}${conJp ? ' ／ ' + conJp : ''}` : 'HYG星表 (実在の星)';
  const r = Math.sqrt(s[0] * s[0] + s[1] * s[1] + s[2] * s[2]);
  const ly = r * 3.2616;
  let dTxt, yTxt;
  if (r > 1950) { dTxt = '距離 非常に遠い（正確な距離は未測定）'; yTxt = 'はるか昔に星を発った光です'; }
  else {
    dTxt = `地球から ${ly < 100 ? ly.toFixed(1) : Math.round(ly).toLocaleString()}光年 ・ ${s[3].toFixed(1)}等星`;
    const year = Math.round(2026 - ly);
    yTxt = year >= 0 ? `いま見えている光は 西暦${year}年 に星を発ちました`
                     : `いま見えている光は 紀元前${1 - year}年 に星を発ちました`;
  }
  const c = bvToRGB(s[4]);
  card.innerHTML = `<div class="n" style="color:rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})">${name}</div>
    <div class="s">${sub}</div><div class="d">${dTxt}</div><div class="y">${yTxt}</div>`;
  card.classList.add('show');
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => card.classList.remove('show'), 8000);
}

let snd = null;
function startSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 4);
  // 深宇宙のドローン（低い音がゆっくり呼吸する）
  [55, 82.41, 110.0].forEach((fq, i) => {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = fq;
    const g = ctx.createGain(); g.gain.value = 0.05;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.02 + i * 0.013;
    const lg = ctx.createGain(); lg.gain.value = 0.032;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(master); o.start(); lfo.start();
  });
  // 星のきらめき（ときどき遠くで鈴のような音・宇宙の残響つき）
  const dly = ctx.createDelay(2.0); dly.delayTime.value = 0.55;
  const fb = ctx.createGain(); fb.gain.value = 0.42;
  const dfl = ctx.createBiquadFilter(); dfl.type = 'lowpass'; dfl.frequency.value = 1600;
  dly.connect(fb); fb.connect(dfl); dfl.connect(dly);
  dly.connect(master);
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
  let bellTimer = 0;
  const bell = () => {
    if (!snd) return;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.value = PENTA[(Math.random() * PENTA.length) | 0] * (Math.random() < 0.3 ? 0.5 : 1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 5);
    o.connect(g); g.connect(master); g.connect(dly);
    o.start(); o.stop(ctx.currentTime + 5.2);
    bellTimer = setTimeout(bell, 3500 + Math.random() * 9000);
  };
  bellTimer = setTimeout(bell, 2500);
  snd = { ctx, stop: () => { clearTimeout(bellTimer); master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8); setTimeout(() => ctx.close(), 1000); } };
}

// ブラックホールはゆっくり夜空を旅する
function updateBH() {
  const baz = simT * 0.010 + 1.3 * Math.sin(simT * 0.0093);
  const bel = 0.55 * Math.sin(simT * 0.0061) + 0.28 * Math.sin(simT * 0.017);
  const brad = 26 + 6 * Math.sin(simT * 0.004);
  bhWorld.set(Math.cos(bel) * Math.cos(baz), Math.cos(bel) * Math.sin(baz), Math.sin(bel)).multiplyScalar(brad);
}

// 宇宙の時間を進める（通常は1コマぶん・検証やタイムラプスではまとめて）
function advanceSim(sec) {
  let rem = sec;
  while (rem > 1e-6) {
    const st = Math.min(rem, 0.05); rem -= st;
    simT += st; updateBH();
    if (!bhOn) { spawnAcc = 0; continue; } // BHモードOFF中は銀河の営みも休止
    spawnAcc += st;
    while (spawnAcc > 1.2) { spawnAcc -= 1.2; if (nb.length < NB_MAX) spawnStar(); else doomOldest(); } // 満員なら誕生の代わりに古い星が落ちる
    updateNewborn(st);
  }
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now; tNow = now / 1000;
  const t = tNow;

  advanceSim(dt * SIM.speed);
  writeNbBuffers();
  flash *= Math.pow(0.03, Math.max(dt, dt * SIM.speed)); // 閃光の減衰

  // カメラ
  const idle = Math.min(1, Math.max(0, (t - lastUserT - 8) / 8));
  if (mode === 'orbit') {
    // ── 宇宙遊泳：フリックで見ている奥へ突き進み（進行方向を向く＝前進感）、限界で中心へ向き直す ──
    if (seekingBH && bhOn) {
      _rt.copy(bhWorld).normalize().multiplyScalar(-14); // BHの反対側・半径14へ寄って中心越しにBHを見る
      cpos.lerp(_rt, Math.min(1, dt * 1.5));
      cvel.multiplyScalar(Math.pow(0.2, dt));
      if (cpos.distanceTo(_rt) < 0.4) { seekingBH = false; lastUserT = tNow; }
    } else {
      diveT += dt;
      const r = Math.max(0.001, cpos.length());
      const sp0 = cvel.length();
      if (sp0 > 3) { // ダイブ中：まず直進、やがてフリック方向へゆっくりじっくり旋回
        const w = Math.min(1, Math.max(0, (diveT - ORB.straightT) / ORB.rampT));
        if (w > 0) { _q.setFromAxisAngle(steerAxis, ORB.turn * w * dt); cvel.applyQuaternion(_q); }
        cvel.multiplyScalar(Math.pow(ORB.drag, dt));
      } else { // 漂い（今まで通りのランダム浮遊）
        cvel.addScaledVector(cpos, -ORB.K * dt);
        cvel.multiplyScalar(Math.pow(ORB.driftDrag, dt));
        if (idle > 0) {
          if (t > wanderNext) {
            wanderNext = t + 5 + Math.random() * 7;
            precAxis.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
            _rt.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
            _rt.addScaledVector(cpos, -_rt.dot(cpos) / (r * r)); // 接線方向へ
            if (_rt.lengthSq() > 1e-6) cvel.addScaledVector(_rt.normalize(), (0.5 + Math.random()) * wanderSpeed * idle);
            wRoll = (Math.random() - 0.5) * 0.26;
          }
          _q.setFromAxisAngle(precAxis, 0.06 * wanderSpeed * idle * dt);
          cpos.applyQuaternion(_q); cvel.applyQuaternion(_q);
        }
      }
      cpos.addScaledVector(cvel, dt);
      // 限界エリア：壁に沿わせて強めに減速→勢いが尽きて回頭フェーズ（＝強制的に中心へ旋回）が始まる
      const rr = cpos.length();
      if (rr > ORB.rMax) {
        cpos.multiplyScalar(ORB.rMax / rr); _up.copy(cpos).normalize();
        const vOut = cvel.dot(_up); if (vOut > 0) cvel.addScaledVector(_up, -vOut);
        cvel.multiplyScalar(Math.pow(ORB.wallDrag, dt));
      } else if (rr < ORB.rMin) { // 中心のすぐ近くはかすめて通過（滑らせるだけ）
        cpos.multiplyScalar(ORB.rMin / rr); _up.copy(cpos).normalize();
        const vIn = cvel.dot(_up); if (vIn < 0) cvel.addScaledVector(_up, -vIn);
      }
    }
    // 見る向き：直進中は進行方向（奥）。勢いが尽きたら“自分を中心に”フリック方向へゆっくり回頭し、
    // 中心をとらえたところで旋回おわり→通常（中心を見る漂い）へ。
    const speed = cvel.length();
    _up.copy(cpos).normalize().multiplyScalar(-1);              // 中心方向
    if (seekingBH) {
      diving = false;
      _rt.copy(bhWorld).normalize();
      viewTarget.lerp(_rt, Math.min(1, dt * ORB.turnSpd)).normalize();
    } else if (diving) {
      if (speed > 3) { // 超スピード直進中：奥（進行方向）を見る
        _rt.copy(cvel).multiplyScalar(1 / speed);
        viewTarget.lerp(_rt, Math.min(1, dt * ORB.turnSpd)).normalize();
      } else {         // 回頭フェーズ：フリック方向へ一定の向きにゆっくり回り続ける
        _q.setFromAxisAngle(steerAxis, ORB.turnSlow * dt);
        viewTarget.applyQuaternion(_q).normalize();
        if (viewTarget.dot(_up) > 0.9 || diveT > 40) diving = false; // 中心をとらえたら終了(保険40s)
      }
    } else {
      viewTarget.lerp(_up, Math.min(1, dt * 0.5)).normalize();  // 通常：中心を見る
    }
    roll += ((seekingBH ? 0 : wRoll) * idle - roll) * Math.min(1, dt * 0.5); // 左右の傾き
    camR = cpos.length();
    lookAlong();
    if (roll) camera.rotateZ(roll);
  } else if (mode === 'history') {
    // ── 歴史モード：地球の傍らで46億年を眺める ──
    updateHistory(dt);
    camera.position.set(0, 0, 0.001);
    camera.quaternion.copy(hCam.quaternion); // 背景の星空はhCamの向きと同期
  } else if (mode === 'tour') {
    // ── 太陽系めぐり：天体の傍らで本物の姿を眺める ──
    updateTour(dt);
    camera.position.set(0, 0, 0.001);
    camera.quaternion.copy(tCam.quaternion); // 背景の星空はtCamの向きと同期
  } else {
    // ── 地球の夜空：太陽の位置に降りて、地上と同じ本物の空を見回す ──
    gazeR += (0.02 - gazeR) * Math.min(1, dt * 1.2);
    camR = gazeR;
    let target = null;
    if (seekingBH && bhOn) target = bhWorld.clone().normalize();
    else if (seekCon >= 0) target = conDir[seekCon];
    if (target) {
      const tLon = Math.atan2(target.y, target.x), tLat = Math.asin(Math.max(-1, Math.min(1, target.z)));
      let dLon = tLon - gazeLon;
      while (dLon > Math.PI) dLon -= Math.PI * 2;
      while (dLon < -Math.PI) dLon += Math.PI * 2;
      gazeLon += dLon * Math.min(1, dt * 2.2); gazeLat += (tLat - gazeLat) * Math.min(1, dt * 2.2);
      if (Math.abs(dLon) < 0.02 && Math.abs(tLat - gazeLat) < 0.02) { seekingBH = false; seekCon = -1; lastUserT = tNow; }
    } else {
      vgLon *= Math.pow(0.85, dt); vgLat *= Math.pow(0.85, dt);
      gazeLon += vgLon * dt + 0.006 * dt * idle; // ゆっくり空が流れる
      gazeLat += vgLat * dt;
      gazeLat = Math.max(-1.5, Math.min(1.5, gazeLat));
    }
    camera.up.set(0, 0, 1);
    camera.position.copy(cpos).setLength(camR);
    camera.lookAt(
      camera.position.x + Math.cos(gazeLat) * Math.cos(gazeLon),
      camera.position.y + Math.cos(gazeLat) * Math.sin(gazeLon),
      camera.position.z + Math.sin(gazeLat));
  }
  updateApparentMags();

  // ブラックホールの画面位置をシェーダーへ
  const vp = bhWorld.clone().applyMatrix4(camera.matrixWorldInverse);
  let onT = 0;
  if (bhOn && mode !== 'history' && mode !== 'tour' && vp.z < -0.5) {
    const pj = bhWorld.clone().project(camera);
    const W = innerWidth * PR, H = innerHeight * PR;
    const bx = (pj.x + 1) / 2 * W, by = (pj.y + 1) / 2 * H;
    if (bx > -W * 0.6 && bx < W * 1.6 && by > -H * 0.6 && by < H * 1.6) {
      postUni.uBH.value.set(bx, by);
      postUni.uRpx.value = RS_WORLD * Math.cbrt(bhMass / 900) / vp.length() * (H * 0.5 / Math.tan(camera.fov * 0.5 * Math.PI / 180));
      onT = 1;
    }
  }
  postUni.uOn.value += (onT - postUni.uOn.value) * Math.min(1, dt * 3);
  postUni.uFlash.value = flash;
  postUni.uTime.value = t;
  starUniforms.uTime.value = t;

  // カウンター表示（0.3秒ごと）
  if (t - statT > 0.3) {
    statT = t;
    $('nBorn').textContent = born.toLocaleString();
    $('nGone').textContent = gone.toLocaleString();
    // 現在地表示：太陽からの距離と最寄りの星
    if (mode === 'history') {
      $('pos').textContent = '⏳ 地球と月の46億年 ─ ドラッグで見回す';
    } else if (mode === 'tour') {
      $('pos').textContent = `🪐 太陽系めぐり: ${tourBodies[tourIdx].name} ─ 左右フリックで次の天体へ`;
    } else if (mode === 'gaze') {
      $('pos').textContent = '🌍 地球の夜空 ─ いま地上で見えるままの空';
    } else {
      let ni = -1, nd2 = 1e18;
      const cp = camera.position;
      for (let i = 0; i < nReal; i++) {
        const dx = pos[i * 3] - cp.x, dy = pos[i * 3 + 1] - cp.y, dz = pos[i * 3 + 2] - cp.z;
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < nd2) { nd2 = d2; ni = i; }
      }
      const p = D.names[ni];
      const nName = p ? (JP_STAR[p] || p) : (D.stars[ni][5] >= 0 ? (JP_CON[D.cons[D.stars[ni][5]]] || '') + 'の星' : '名もなき星');
      $('pos').textContent = `太陽から ${(cp.length() * 3.2616).toFixed(0)}光年 ／ 最寄り ${nName} ${(Math.sqrt(nd2) * 3.2616).toFixed(1)}光年`;
    }
    $('speed').style.display = (mode === 'orbit') ? '' : 'none'; // スライダーは宇宙遊泳モードだけ
    if (t - uiWakeT > 3 && uiWakeT > 0) { $('ui').classList.add('fade'); $('stats').classList.add('fade'); $('pos').classList.add('fade'); $('speed').classList.add('fade'); }
  }

  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(scene, camera);
  if (mode === 'history') { renderer.clearDepth(); renderer.render(hScene, hCam); }
  if (mode === 'tour') { renderer.clearDepth(); renderer.render(tScene, tCam); }
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}
bhWorld.set(26, 0, 0); // BHの初期位置（モードONにした瞬間から銀河が育ち始める）
wakeUI();
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  hCam.aspect = innerWidth / innerHeight;
  hCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rt.setSize(innerWidth * PR, innerHeight * PR);
  postUni.uRes.value.set(innerWidth * PR, innerHeight * PR);
});
</script>
</body>
</html>
